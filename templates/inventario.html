{% extends "base.html" %}

{% block title %}Inventario - Minuto para Ganar{% endblock %}

{% block content %}
<style>
  body {
    background: radial-gradient(circle at top center, #1a1b26 0%, #090a0f 100%);
    min-height: 100vh;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }

  .glass-card {
    background: rgba(18, 20, 29, 0.75);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
  }
</style>

<div class="container py-4" style="max-width: 1100px;">
  <!-- Encabezado -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div class="d-flex align-items-center gap-3">
      <img src="{{ url_for('static', filename='img/caja.png') }}" alt="Inventario" style="width: 45px; height: 45px; object-fit: contain;">
      <h2 class="fw-bold m-0 text-uppercase text-white">Inventario de Juegos</h2>
    </div>
    <a href="/" class="btn btn-outline-light btn-sm rounded-3">← Volver al Panel</a>
  </div>

  <div class="row g-4">
    <!-- Formulario para Registrar Juego -->
    <div class="col-md-4">
      <div class="glass-card p-4">
        <h4 class="fw-bold mb-3 text-primary">Agregar Nuevo Juego</h4>
        <form id="formProducto">
          <div class="mb-3">
            <label class="form-label small text-secondary">Nombre del Juego</label>
            <input type="text" id="nombre" class="form-control bg-dark text-white border-secondary" required placeholder="Ej: Tuercas locas">
          </div>
          <div class="mb-3">
            <label class="form-label small text-secondary">Descripción / Reglas</label>
            <textarea id="descripcion" class="form-control bg-dark text-white border-secondary" rows="2" placeholder="Detalles o instrucciones del juego..."></textarea>
          </div>
          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="form-label small text-secondary">Cantidad / Stock</label>
              <input type="number" id="cantidad" class="form-control bg-dark text-white border-secondary" min="0" value="1" required>
            </div>
            <div class="col-6">
              <label class="form-label small text-secondary">Precio ($)</label>
              <input type="number" step="0.01" id="precio" class="form-control bg-dark text-white border-secondary" min="0" value="0.00" required>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-bold py-2.5 rounded-3">Registrar Juego</button>
        </form>
      </div>
    </div>

    <!-- Tabla de Juegos -->
    <div class="col-md-8">
      <div class="glass-card p-4">
        <h4 class="fw-bold mb-3 text-white">Juegos en Existencia</h4>
        
        <!-- Buscador en tiempo real -->
        <div class="mb-3">
          <input type="text" id="buscador" class="form-control bg-dark text-white border-secondary rounded-3" placeholder="🔍 Buscar juego en el inventario..." onkeyup="filtrarTabla()">
        </div>

        <div class="table-responsive">
          <table class="table table-dark table-hover align-middle bg-transparent">
            <thead>
              <tr class="text-secondary border-bottom border-secondary">
                <th>Nombre / Descripción</th>
                <th>Stock</th>
                <th>Precio Indiv.</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="tablaProductos">
              <tr><td colspan="4" class="text-center text-muted">Cargando inventario...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    cargarProductos();
    document.getElementById("formProducto").addEventListener("submit", guardarProducto);
  });

  async function cargarProductos() {
    const res = await fetch("/api/productos");
    const productos = await res.json();
    const tbody = document.getElementById("tablaProductos");

    if (productos.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">No hay juegos en el inventario.</td></tr>';
      return;
    }

    tbody.innerHTML = "";
    productos.forEach(p => {
      const stockBadge = p.cantidad <= 5 
        ? `<span class="badge bg-danger">${p.cantidad} (Bajo)</span>` 
        : `<span class="badge bg-success">${p.cantidad} disp.</span>`;

      tbody.innerHTML += `
        <tr class="border-bottom border-secondary border-opacity-25">
          <td class="fw-bold">${p.nombre}<br><small class="text-secondary">${p.descripcion || 'Sin descripción'}</small></td>
          <td>${stockBadge}</td>
          <td>$${p.precio.toFixed(2)}</td>
          <td>
            <button class="btn btn-sm btn-outline-danger rounded-2" onclick="eliminarProducto(${p.id})">Eliminar</button>
          </td>
        </tr>
      `;
    });
  }

  async function guardarProducto(e) {
    e.preventDefault();
    const payload = {
      nombre: document.getElementById("nombre").value,
      descripcion: document.getElementById("descripcion").value,
      cantidad: parseInt(document.getElementById("cantidad").value),
      precio: parseFloat(document.getElementById("precio").value)
    };

    const res = await fetch("/api/productos", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (res.ok) {
      document.getElementById("formProducto").reset();
      cargarProductos();
    } else {
      const err = await res.json();
      alert(err.error || "Error al guardar producto");
    }
  }

  async function eliminarProducto(id) {
    if (!confirm("¿Deseas eliminar este juego del inventario?")) return;
    const res = await fetch(`/api/productos/${id}`, { method: "DELETE" });
    if (res.ok) cargarProductos();
  }

  function filtrarTabla() {
    const query = document.getElementById("buscador").value.toLowerCase();
    const filas = document.querySelectorAll("#tablaProductos tr");
    filas.forEach(f => {
      const texto = f.innerText.toLowerCase();
      f.style.display = texto.includes(query) ? "" : "none";
    });
  }
</script>
{% endblock %}
